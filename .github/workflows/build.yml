name: Build Debug APK

on:
  push:
    branches: [ "main", "claude/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # The repository does not ship a Gradle wrapper, so the action provides Gradle itself.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/vipo-debug.apk
          ls -lh dist

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vipo-debug-apk
          path: dist/vipo-debug.apk
          if-no-files-found: error

      # Release assets can be downloaded directly, without signing in to GitHub Actions.
      - name: Publish APK as a prerelease
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/claude/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/vipo-debug.apk \
            --title "Vipo debug build ${GITHUB_RUN_NUMBER}" \
            --notes "Debug APK built from ${GITHUB_REF_NAME} (${GITHUB_SHA})." \
            --prerelease \
            --target "${GITHUB_SHA}"
